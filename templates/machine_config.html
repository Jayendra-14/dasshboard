<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; }
        .illustrator-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        .machine-svg { max-width: 400px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1)); }
    </style>
</head>
<body>
<div class="container py-5">
    <a href="{% url 'home' %}" class="btn btn-link text-decoration-none mb-4"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    
    <div class="row">
        <div class="col-lg-6 mb-4">
            <div class="illustrator-box">
                <h3 class="fw-bold mb-4">Unit #{{ machine_id }} Blueprint</h3>
                
                <svg class="machine-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <rect x="40" y="140" width="120" height="40" rx="5" fill="#334155" />
                    <rect x="60" y="40" width="80" height="100" fill="#64748b" />
                    
                    <circle cx="100" cy="90" r="20" fill="#94a3b8" />
                    
                    <circle cx="75" cy="55" r="5" 
                        fill="{% if machine_id == 1 %}#ef4444{% else %}#10b981{% endif %}">
                        {% if machine_id == 1 %}
                            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
                        {% endif %}
                    </circle>
                    
                    <path d="M140 80 L170 80 L170 120" stroke="#334155" stroke-width="5" fill="none" />
                </svg>
                
                <p class="mt-3">Status: 
                    <span class="fw-bold {% if machine_id == 1 %}text-danger{% else %}text-success{% endif %}">
                        {% if machine_id == 1 %}CRITICAL ALARM{% else %}SYSTEM NOMINAL{% endif %}
                    </span>
                </p>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card border-0 shadow-sm p-4">
                <h4 class="fw-bold mb-4">Control Settings</h4>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Update Interval (ms)</label>
                        <input type="number" class="form-control" value="1000">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Emergency Threshold (°C)</label>
                        <input type="range" class="form-range" min="50" max="200" value="110">
                    </div>
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" checked>
                        <label class="form-check-label">Enable Cloud Logging</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Save Configuration</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
